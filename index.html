<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACT3 - Variables y Operadores Javascript</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <h1>ACT3 - Variables y Operadores</h1>
  <p class="subtitulo">Calculadora básica con JavaScript</p>

  <div class="contenedor">

    <label for="num1">Número 1:</label>
    <input type="number" id="num1" placeholder="Escribe un número">

    <label for="num2">Número 2:</label>
    <input type="number" id="num2" placeholder="Escribe un número">

    <div class="botones">
      <button class="btn-suma"     onclick="operar('suma')">➕ Suma</button>
      <button class="btn-resta"    onclick="operar('resta')">➖ Resta</button>
      <button class="btn-multi"    onclick="operar('multiplicacion')">✖️ Multiplicación</button>
      <button class="btn-division" onclick="operar('division')">➗ División</button>
      <button class="btn-limpiar"  onclick="limpiar()">🗑️ Limpiar</button>
    </div>

    <div class="resultado" id="resultado">
      Aquí aparecerá el resultado...
    </div>

  </div>

  <footer>Alumno: &nbsp; | &nbsp; Fecha: 29/04/2026</footer>

  <script src="script.js"></script>

</body>
</html>
